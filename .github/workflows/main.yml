
name: Build DT Creator Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Find project folder
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "requirements.txt")
          }
          if ($projects.Count -ne 1) {
            throw "Project folder not found or ambiguous"
          }
          "PROJECT_DIR=$($projects[0].FullName)" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR\requirements.txt"
          python -m pip install pyinstaller
          python -c "import ctypes, _ctypes; print('ctypes OK')"

      - name: Build application
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --noconfirm --clean --onedir --name DT_Creator --collect-all streamlit --collect-all altair --collect-all pyarrow --add-data "dt_creator;dt_creator" dt_creator\launcher.py

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR\dist\DT_Creator" -DestinationPath "$env:GITHUB_WORKSPACE\DT_Creator_Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DT_Creator_Windows
          path: DT_Creator_Windows.zip
